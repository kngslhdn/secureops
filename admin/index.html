:root{--navy:#071a30;--navy2:#102d4b;--gold:#c99a3d;--bg:#f4f6f9;--card:#fff;--line:#e5e7eb;--muted:#64748b;--text:#111827;--red:#b91c1c}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font:14px Poppins,Arial,sans-serif;color:var(--text);background:var(--bg)}button,input{font:inherit}.hidden{display:none!important}
.login{min-height:100vh;display:grid;place-items:center;padding:20px;background:radial-gradient(circle at 50% 0,#173c64,#071a30 68%)}
.login-card{width:min(430px,100%);background:#fff;border-radius:18px;padding:30px;box-shadow:0 25px 80px #0007}.logo-text{width:120px;height:76px;display:flex;align-items:center;justify-content:center;margin:0 auto 12px;color:var(--navy);font-weight:700;font-size:24px;letter-spacing:3px}.logo{width:120px;height:76px;object-fit:contain;display:block;margin:0 auto 12px;filter:brightness(0)}.brand{text-align:center;color:var(--navy);font-weight:700;font-size:20px}.brand small{display:block;color:var(--muted);font-weight:400;font-size:10px;margin-top:5px;letter-spacing:1px}.login-card h1{font-size:14px;margin:28px 0 6px}.login-card p{color:var(--muted);font-size:12px;margin:0 0 22px}.field{margin:15px 0}.field label{display:block;font-size:12px;font-weight:700;margin-bottom:6px}.field input{width:100%;padding:12px;border:1px solid var(--line);border-radius:9px;outline:none}.login-btn{width:100%;padding:13px;border:1px solid var(--navy);border-radius:9px;background:var(--navy);color:#fff;font-weight:700;cursor:pointer;transition:transform .14s ease,background .14s ease,border-color .14s ease,box-shadow .14s ease;box-shadow:0 2px 5px rgba(7,26,48,.12)}.login-btn:hover{background:#102d4b;border-color:#c99a3d;transform:translateY(-1px);box-shadow:0 5px 14px rgba(7,26,48,.16)}.login-btn:active{transform:translateY(0);box-shadow:0 1px 3px rgba(7,26,48,.08)}.login-btn:focus-visible{outline:2px solid #c99a3d;outline-offset:2px}.login-btn:disabled{opacity:.55;cursor:not-allowed;transform:none;box-shadow:none}.login-divider{display:flex;align-items:center;gap:12px;margin:15px 0;color:#64748b;font-size:11px}.login-divider::before,.login-divider::after{content:"";height:1px;flex:1;background:#e5e7eb}.google-btn{width:100%;padding:11px 13px;border:1px solid #cbd5e1;border-radius:9px;background:#fff;color:#334155;font-weight:600;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:9px;transition:transform .14s ease,background .14s ease,border-color .14s ease,box-shadow .14s ease}.google-btn:hover{background:#f8fafc;border-color:#94a3b8;transform:translateY(-1px);box-shadow:0 4px 12px rgba(15,23,42,.10)}.google-btn:active{transform:translateY(0);box-shadow:none}.google-btn:focus-visible{outline:2px solid #c99a3d;outline-offset:2px}.google-btn:disabled{opacity:.55;cursor:not-allowed;transform:none;box-shadow:none}.google-icon{width:18px;height:18px;display:block;flex:0 0 18px}.back-form{display:block;text-align:center;margin-top:14px;color:var(--navy);font-size:12px;font-weight:700;text-decoration:none}.back-form:hover{text-decoration:underline}.error{color:var(--red);font-size:12px;min-height:18px;margin-top:10px}
@media (min-width:901px) and (max-height:850px){
  html,body{height:100%;min-height:100%;overflow:hidden}
  .login{height:100dvh;min-height:100dvh;padding:8px;overflow:hidden}

  .logo-text{width:70px;height:40px;margin-bottom:4px;font-size:17px}.logo{width:70px;height:40px;margin:0 auto 4px}
  .brand{font-size:16px;line-height:1.15}

  .field{margin:7px 0}
  .field label{font-size:10px;margin-bottom:3px}
  .field input{padding:8px;border-radius:7px}
  .login-btn{padding:9px;border-radius:7px}
  .login-divider{margin:9px 0;font-size:10px}
  .google-btn{padding:8px 10px;border-radius:7px;font-size:11px}

  .error{font-size:10px;min-height:13px;margin-top:4px}
}
.top{height:70px;background:var(--navy);color:#fff;display:flex;align-items:center;justify-content:space-between;padding:0 28px;position:sticky;top:0;z-index:1000}.top-logo{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);height:46px;max-width:170px;width:auto;object-fit:contain;background:transparent;border-radius:0;padding:0;box-sizing:border-box}.top-logo:focus{outline:2px solid #c99a3d;outline-offset:4px}.top-title{font-weight:700;font-size:14px;line-height:1.15;letter-spacing:0;text-transform:uppercase}.top-title small{display:block;font-weight:400;opacity:.6;font-size:9px;line-height:1.2;margin-top:4px;letter-spacing:1px;text-transform:uppercase}.user{display:flex;align-items:center;gap:12px}.user-info{text-align:right;font-size:11px}.user-info small{display:block;opacity:.6;margin-top:3px}.logout{background:#fff1;color:#fff;border:1px solid #ffffff33;border-radius:8px;padding:8px 12px;cursor:pointer;transition:transform .14s ease,background .14s ease,border-color .14s ease,box-shadow .14s ease}.logout:hover{background:#ffffff12;border-color:#c99a3d;color:#fff;transform:translateY(-1px);box-shadow:0 4px 12px #0003}.logout:active{transform:translateY(0)}.logout:focus-visible{outline:2px solid #c99a3d;outline-offset:2px}
.actionbar{height:48px;background:#fff;border-bottom:1px solid var(--line);box-shadow:0 2px 8px rgba(7,26,48,.035);display:flex;align-items:center;justify-content:flex-end;padding:0 24px;position:sticky;top:70px;z-index:999}.actionbar-inner{display:flex;justify-content:flex-end;align-items:center;gap:8px;width:100%;max-width:1400px}.actionbar a,.actionbar button{color:var(--navy);background:#fff;border:1px solid #d6dde5;border-radius:8px;padding:8px 12px;text-decoration:none;cursor:pointer;font:600 10px Poppins,Arial,sans-serif;transition:transform .14s ease,border-color .14s ease,box-shadow .14s ease}.actionbar a.emergency-link{background:var(--red);color:#fff;border-color:var(--red)}.actionbar a:hover,.actionbar button:hover{border-color:var(--gold);background:#fbfcfd;transform:translateY(-1px);box-shadow:0 4px 12px rgba(7,26,48,.08)}.actionbar a.emergency-link:hover{background:#991b1b;border-color:#991b1b;color:#fff}.actionbar a:focus-visible,.actionbar button:focus-visible{outline:2px solid var(--gold);outline-offset:2px}#app:not(.hidden){min-height:100vh}.v2-loading{display:none!important}

<body>
<section id="login" class="login hidden"><div class="login-card">
<img class="logo" src="https://bosfcjwacdrwtwgpmaex.supabase.co/storage/v1/object/public/property-assets/HIKJ/32d10d47-b483-494f-bb39-e477858addf2.png?v=20261006" alt="Hotel Indonesia Kempinski Jakarta" width="120" height="76" fetchpriority="high" decoding="async">
<div class="brand">Hotel Indonesia Kempinski Jakarta<small>SECURITY ADMINISTRATION CONSOLE<br><span class="app-version" data-app-version>ks.v.001</span></small></div>
<h1>SECUREOPS Admin Sign In</h1><p>Authorized SECUREOPS administrators only</p>
<form id="loginForm"><div class="field"><label>Email</label><input id="email" type="email" autocomplete="username" required></div><div class="field"><label>Password</label><input id="password" type="password" autocomplete="current-password" required></div><button id="loginBtn" class="login-btn" type="submit">SIGN IN</button><div class="login-divider"><span>OR</span></div><button id="googleLoginBtn" class="google-btn" type="button"><svg class="google-icon" viewBox="0 0 24 24" aria-hidden="true"><path fill="#4285F4" d="M21.35 12.27c0-.7-.06-1.38-.18-2.03H12v3.84h5.22a4.46 4.46 0 0 1-1.94 2.93v2.43h3.14c1.84-1.69 2.93-4.18 2.93-7.17z"/><path fill="#34A853" d="M12 21.72c2.64 0 4.86-.87 6.48-2.36l-3.14-2.43c-.87.58-1.98.92-3.34.92-2.56 0-4.73-1.73-5.51-4.06H3.24v2.51A9.79 9.79 0 0 0 12 21.72z"/><path fill="#FBBC05" d="M6.49 13.79A5.88 5.88 0 0 1 6.18 12c0-.62.11-1.22.31-1.79V7.7H3.24A9.78 9.78 0 0 0 2.2 12c0 1.58.38 3.07 1.04 4.3l3.25-2.51z"/><path fill="#EA4335" d="M12 6.15c1.43 0 2.71.49 3.72 1.45l2.79-2.79C16.86 3.19 14.64 2.28 12 2.28a9.79 9.79 0 0 0-8.76 5.42l3.25 2.51C7.27 7.88 9.44 6.15 12 6.15z"/></svg><span>Sign in with Google</span></button><a class="back-form" href="../">← Back to Form</a><div id="loginError" class="error"></div></form>
</div></section>
<section id="app" class="hidden"><header class="top"><div class="top-title">SECUREOPS<small>SECURITY ADMIN CONSOLE<br><span class="app-version" data-app-version>ks.v.001</span></small></div><div id="propertyBrand"><img class="top-logo" src="https://bosfcjwacdrwtwgpmaex.supabase.co/storage/v1/object/public/property-assets/HIKJ/32d10d47-b483-494f-bb39-e477858addf2.png?v=20261006" alt="Hotel Indonesia Kempinski Jakarta" width="170" height="46" fetchpriority="high" decoding="async"></div><div class="user"><div class="user-info"><b id="userName">Admin</b><small id="userRole">—</small></div></div></header><div class="actionbar"><div class="actionbar-inner"><a class="emergency-link" href="/secureops/emergency/">Emergency</a><button id="logout">Sign Out</button></div></div><div id="v2Boot" class="v2-loading">Loading Security Admin Console…</div></section>
<script>
const SUPABASE_URL=window.SECUREOPS_CONFIG.SUPABASE_URL;
const SUPABASE_PUBLISHABLE_KEY=window.SECUREOPS_CONFIG.SUPABASE_PUBLISHABLE_KEY;
const sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_PUBLISHABLE_KEY,{auth:{persistSession:true,autoRefreshToken:true,storageKey:'secureops-auth-token'}});
const API=SUPABASE_URL+'/functions/v1/admin-console-api';
async function profile(session){const r=await fetch(API+'?action=summary',{headers:{apikey:SUPABASE_PUBLISHABLE_KEY,Authorization:'Bearer '+session.access_token}});const j=await r.json();if(!r.ok)throw Error(j.error||'Unable to load admin profile');document.getElementById('userName').textContent=j.profile?.full_name||session.user.email;document.getElementById('userRole').textContent=j.profile?.role||'ADMIN';window.HIKJAdminRole=String(j.profile?.role||'').toUpperCase();}
function showLogin(message=''){document.getElementById('app').classList.add('hidden');document.getElementById('login').classList.remove('hidden');document.getElementById('loginError').textContent=message}
async function enter(session){await profile(session);document.getElementById('login').classList.add('hidden');document.getElementById('app').classList.remove('hidden');window.dispatchEvent(new CustomEvent('hikj-admin-ready',{detail:{session}}));if(window.HIKJAdminV2Build)window.HIKJAdminV2Build()}
async function initAuth(){const {data,error}=await sb.auth.getSession();if(error||!data.session){showLogin(error?.message||'Please sign in to continue');return}try{await enter(data.session)}catch(e){console.error('Admin bootstrap failed:',e);showLogin('Session could not be validated. Please sign in again.')}}
document.getElementById('googleLoginBtn').addEventListener('click',async()=>{const b=document.getElementById('googleLoginBtn'),err=document.getElementById('loginError');b.disabled=true;b.querySelector('span').textContent='REDIRECTING TO GOOGLE…';err.textContent='';try{const redirectTo=window.location.origin+window.location.pathname;const {error}=await sb.auth.signInWithOAuth({provider:'google',options:{redirectTo,queryParams:{access_type:'offline',prompt:'select_account'}}});if(error)throw error}catch(e){err.textContent=e.message||'Google sign-in could not be started';b.disabled=false;b.querySelector('span').textContent='Sign in with Google'}});
document.getElementById('loginForm').addEventListener('submit',async ev=>{ev.preventDefault();const b=document.getElementById('loginBtn'),err=document.getElementById('loginError');b.disabled=true;b.textContent='SIGNING IN…';err.textContent='';try{const {data,error}=await sb.auth.signInWithPassword({email:document.getElementById('email').value.trim(),password:document.getElementById('password').value});if(error)throw error;if(!data.session)throw Error('No authenticated session returned');await enter(data.session)}catch(e){showLogin(e.message||String(e))}finally{b.disabled=false;b.textContent='SIGN IN'}});
document.getElementById('logout').onclick=async()=>{await sb.auth.signOut();showLogin('Signed out successfully')};
sb.auth.onAuthStateChange((event,s)=>{if(event==='SIGNED_OUT')showLogin('Your session has ended. Please sign in again');else if(event==='SIGNED_IN'&&s)setTimeout(()=>enter(s).catch(e=>showLogin('Session could not be validated. Please sign in again.')),0)});
initAuth();
</script>
