<script>
const SUPABASE_URL=window.SECUREOPS_CONFIG.SUPABASE_URL;
const SUPABASE_PUBLISHABLE_KEY=window.SECUREOPS_CONFIG.SUPABASE_PUBLISHABLE_KEY;
const sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_PUBLISHABLE_KEY,{auth:{persistSession:true,autoRefreshToken:true,storageKey:'secureops-auth-token'}});
const API=SUPABASE_URL+'/functions/v1/admin-console-api';
async function profile(session){const r=await fetch(API+'?action=summary',{headers:{apikey:SUPABASE_PUBLISHABLE_KEY,Authorization:'Bearer '+session.access_token}});const j=await r.json();if(!r.ok)throw Error(j.error||'Unable to load admin profile');document.getElementById('userName').textContent=j.profile?.full_name||session.user.email;document.getElementById('userRole').textContent=j.profile?.role||'ADMIN';window.HIKJAdminRole=String(j.profile?.role||'').toUpperCase();window.HIKJPropertyBranding=j.branding||null;applyPropertyBranding(j.branding)}
function applyPropertyBranding(b){
 const wrap=document.getElementById('propertyBrand');if(!wrap)return;
 const url=String(b?.logo_url||'').trim();
 if(url){wrap.innerHTML='<img class="top-logo" alt="" title="">';const img=wrap.querySelector('img');img.src=url;img.alt=b?.property_name||'Property Logo';img.title=b?.property_name||'Property Logo';img.onerror=()=>{wrap.innerHTML='<div class="top-logo-text" aria-label="SECUREOPS">SECUREOPS</div>'};}
 else wrap.innerHTML='<div class="top-logo-text" aria-label="SECUREOPS">SECUREOPS</div>';
}
async function loadPublicBranding(){
 try{
  const r=await fetch(SUPABASE_URL+'/functions/v1/visitor-submit',{headers:{apikey:SUPABASE_PUBLISHABLE_KEY}});
  const j=await r.json();const b=j.branding,url=String(b?.logo_url||'').trim();
  if(!url)return;
  const logo=document.querySelector('#login .logo-text');
  if(logo){const img=document.createElement('img');img.className='logo';img.alt=b?.property_name||'Property Logo';img.src=url;img.onerror=()=>img.remove();logo.replaceWith(img);}
  const brand=document.querySelector('#login .brand');
  if(brand&&b?.property_name)brand.innerHTML=escBrand(b.property_name)+'<small>SECURITY ADMIN CONSOLE<br><span class="app-version" data-app-version>ks.v.001</span></small>';
 }catch(e){}
}
function escBrand(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));}
loadPublicBranding();
function showLogin(message=''){document.getElementById('app').classList.add('hidden');document.getElementById('login').classList.remove('hidden');document.getElementById('loginError').textContent=message}
let adminEnteredSessionId='';
let adminEnterPromise=null;
const sleep=ms=>new Promise(resolve=>setTimeout(resolve,ms));
async function getStableSession(fallback){
  for(let i=0;i<6;i++){
    const {data,error}=await sb.auth.getSession();
    if(!error&&data.session?.access_token)return data.session;
    await sleep(150);
  }
  return fallback||null;
}
async function enter(session){
  if(!session?.access_token)throw Error('No authenticated session returned');
  if(adminEnterPromise)return adminEnterPromise;
  if(adminEnteredSessionId===session.user?.id){return}
  adminEnterPromise=(async()=>{
    const stable=await getStableSession(session);
    if(!stable?.access_token)throw Error('Authentication session is not ready. Please sign in again.');
    await profile(stable);
    adminEnteredSessionId=stable.user?.id||'';
    document.getElementById('login').classList.add('hidden');
    document.getElementById('app').classList.remove('hidden');
    window.dispatchEvent(new CustomEvent('hikj-admin-ready',{detail:{session:stable}}));
    if(window.HIKJAdminV2Build)await window.HIKJAdminV2Build();
  })();
  try{return await adminEnterPromise}finally{adminEnterPromise=null}
}
async function initAuth(){const {data,error}=await sb.auth.getSession();if(error||!data.session){showLogin(error?.message||'Please sign in to continue');return}try{await enter(data.session)}catch(e){console.error('Admin bootstrap failed:',e);await sb.auth.signOut();adminEnteredSessionId='';showLogin(e.message||'This account is not authorized for SECUREOPS Admin Console. Please use a registered account.')}}
document.getElementById('loginForm').addEventListener('submit',async ev=>{ev.preventDefault();const b=document.getElementById('loginBtn'),err=document.getElementById('loginError');b.disabled=true;b.textContent='SIGNING IN…';err.textContent='';try{const {data,error}=await sb.auth.signInWithPassword({email:document.getElementById('email').value.trim(),password:document.getElementById('password').value});if(error)throw error;if(!data.session)throw Error('No authenticated session returned');await enter(data.session)}catch(e){showLogin(e.message||String(e))}finally{b.disabled=false;b.textContent='SIGN IN'}});
document.getElementById('googleLoginBtn').addEventListener('click',async()=>{const b=document.getElementById('googleLoginBtn'),err=document.getElementById('loginError');b.disabled=true;b.querySelector('span').textContent='REDIRECTING TO GOOGLE…';err.textContent='';try{const redirectTo=window.location.origin+window.location.pathname;const {error}=await sb.auth.signInWithOAuth({provider:'google',options:{redirectTo,queryParams:{access_type:'offline',prompt:'select_account'}}});if(error)throw error}catch(e){err.textContent=e.message||'Google sign-in could not be started';b.disabled=false;b.querySelector('span').textContent='Sign in with Google'}});
document.getElementById('logout').onclick=async()=>{adminEnteredSessionId='';adminEnterPromise=null;await sb.auth.signOut();showLogin('Signed out successfully')};
sb.auth.onAuthStateChange((event,s)=>{if(event==='SIGNED_OUT'){adminEnteredSessionId='';adminEnterPromise=null;showLogin('Your session has ended. Please sign in again')}else if(event==='SIGNED_IN'&&s){setTimeout(()=>{enter(s).catch(async e=>{console.error('Auth state bootstrap failed:',e);await sb.auth.signOut();adminEnteredSessionId='';showLogin(e.message||'This Google account is not registered for SECUREOPS Admin Console.')})},250)}});
/* ADMIN CONSOLE V2 — INLINE
   Authentication is initialized above; V2 receives the exact same session.

let pageSeq=0;const isCurrent=token=>token===pageSeq;const $=id=>document.getElementById(id),esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c])),fmt=v=>v?new Date(v).toLocaleString('en-GB',{dateStyle:'short',timeStyle:'short'}):'—',today=()=>new Date().toISOString().slice(0,10),overdueText=m=>{m=Number(m||0);if(m<60)return m+'m overdue';const d=Math.floor(m/1440),h=Math.floor((m%1440)/60),mm=m%60;return (d?d+'d ':'')+(h?h+'h ':'')+(mm?mm+'m ':'')+'overdue'};
