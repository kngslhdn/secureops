name: SECUREOPS QA

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static-qa:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate repository hygiene
        shell: bash
        run: |
          set -euo pipefail
          test ! -e admin/dashboard-v2.js
          test ! -e admin/dashboard-v2.css
          test ! -e admin/admin-package-distribution.js

      - name: Validate required SECUREOPS files and V1 release identity
        shell: bash
        run: |
          set -euo pipefail
          test -f index.html
          test -f admin/index.html
          test -f admin/admin-console-v2.js
          test -f admin/settings.js
          test -f assets/secureops-config.js
          test -f app-config.js
          test -d supabase/functions
          test -d supabase/migrations
          grep -q "window.SECUREOPS_APP_VERSION = 'ks.v.001';" app-config.js
          grep -q 'secureops-version" content="ks.v.001' index.html
          grep -q "SECUREOPS_APP_VERSION" admin/index.html
          grep -q "SECUREOPS_APP_VERSION" emergency/index.html
          grep -q "SECUREOPS_APP_VERSION" emergency/settings/index.html

      - name: Validate JavaScript and release hygiene
        shell: bash
        run: |
          set -euo pipefail
          find admin emergency assets supabase/functions -type f -name '*.js' -print0 |
            while IFS= read -r -d '' f; do
              node --check "$f"
            done
          ! grep -R "hmqgmusellcetakoalva" --exclude-dir=.git .
          ! grep -R "sb-hmqgmusellcetakoalva-auth-token" --exclude-dir=.git .
          ! grep -R "hikj-visitormgmt" --exclude-dir=.git .
          ! grep -R "ks.v.002" --exclude-dir=.git .
          ! grep -R -E "^[[:space:]]*alert\\(" index.html admin emergency assets

      - name: Validate security hardening invariants
        shell: bash
        run: |
          set -euo pipefail
          grep -R -Fq "REVOKE ALL ON TABLE" supabase/migrations || { echo "MISSING_ANON_TABLE_REVOKE"; exit 1; }
          grep -R -Fq "REVOKE ALL ON ALL FUNCTIONS IN SCHEMA public FROM anon" supabase/migrations || { echo "MISSING_ANON_FUNCTION_REVOKE"; exit 1; }
          grep -R -Fq "createSignedUrl" supabase/functions
          ! grep -R -Fq "SUPABASE_SERVICE_ROLE_KEY" index.html admin emergency assets
          grep -A1 -F "[functions.admin-api]" supabase/config.toml | grep -q "verify_jwt = true"
          grep -A1 -F "[functions.admin-console-api]" supabase/config.toml | grep -q "verify_jwt = true"
          grep -A1 -F "[functions.package-distribution]" supabase/config.toml | grep -q "verify_jwt = true"
          grep -A1 -F "[functions.visitor-monitoring]" supabase/config.toml | grep -q "verify_jwt = true"
          grep -A1 -F "[functions.visitor-detail]" supabase/config.toml | grep -q "verify_jwt = true"
          grep -Fq 'ALLOWED_ORIGINS = new Set(["https://kngslhdn.github.io","https://visitor.myhikj.com","http://visitor.myhikj.com","http://localhost:3000","http://127.0.0.1:5500"])' supabase/functions/package-distribution/index.ts
          ! grep -Fq 'Access-Control-Allow-Origin": "*"' supabase/functions/package-distribution/index.ts
          ! grep -Fq '"Access-Control-Allow-Origin": "*"' supabase/functions/emergency-api/index.ts
          ! grep -Fq "'Access-Control-Allow-Origin':'*'" supabase/functions/visitor-submit/index.ts
          grep -Fq 'eq("property_id", propertyId)' supabase/functions/emergency-api/index.ts
          grep -Fq 'resolveRecipients(db, groupIds, directContactIds, profile)' supabase/functions/emergency-api/index.ts
          grep -Fq 'content-type must be application/json' supabase/functions/package-distribution/index.ts || grep -Fq 'Content-Type must be application/json' supabase/functions/package-distribution/index.ts

      - name: Validate migration SQL filenames
        shell: bash
        run: |
          set -euo pipefail
          find supabase/migrations -maxdepth 1 -type f -name '*.sql' -print0 |
            while IFS= read -r -d '' f; do
              base="$(basename "$f")"
              [[ "$base" =~ ^[0-9]{14}_[a-zA-Z0-9_-]+\.sql$ ]] || {
                echo "Invalid migration filename: $base"
                exit 1
              }
            done
