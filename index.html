<script>
async function loadPropertyBranding(){
 try{
  const base=window.SECUREOPS_CONFIG?.SUPABASE_FUNCTIONS_URL||'';
  const r=await fetch(base+'/visitor-submit',{headers:{apikey:window.SECUREOPS_CONFIG?.SUPABASE_PUBLISHABLE_KEY||''}});
  const j=await r.json();
  const b=j.branding,url=String(b?.logo_url||'').trim(),el=document.getElementById('propertyBrandLogo');
  if(!el)return;
  if(url){
   const img=document.createElement('img');img.className='brand-logo';img.alt=b?.property_name||'Property Logo';img.src=url;
   img.onerror=()=>{img.replaceWith(document.createTextNode('SECUREOPS'));};
   el.replaceWith(img);
  }
 }catch(e){/* fallback SECUREOPS */}
}
loadPropertyBranding();
</script>

const DEVICE_LANG=/^id(?:-|$)/i.test(navigator.languages?.[0]||navigator.language||'en')?'id':'en';const LANG={en:{title:'VISITOR MANAGEMENT',admin:'ADMIN CONSOLE',footer:'SECURE  •  SAFE  •  WELCOMING',privacy:'SECUREOPS • ks.v.001',select:'Select',submit:'SUBMIT'},id:{title:'MANAJEMEN PENGUNJUNG',admin:'KONSOL ADMIN',footer:'AMAN  •  TERJAGA  •  RAMAH',privacy:'SECUREOPS • ks.v.001',select:'Pilih',submit:'KIRIM'}};const L=LANG[DEVICE_LANG];const FORM_I18N={masuk:{title:{en:'Visitor Entry Registration',id:'Registrasi Masuk Pengunjung'},description:{en:'Please complete the information before entering Hotel Indonesia Kempinski Jakarta',id:'Silakan lengkapi informasi sebelum memasuki Hotel Indonesia Kempinski Jakarta'}},keluar:{title:{en:'Visitor Exit Registration',id:'Registrasi Keluar Pengunjung'},description:{en:'Enter the Pass / Vest Number and Security Officer Name. Exit date and time are recorded automatically',id:'Masukkan Nomor Pass / Vest dan Nama Petugas Keamanan. Tanggal dan waktu keluar dicatat otomatis'}},pinjamKunci:{title:{en:'Key Borrowing',id:'Peminjaman Kunci'},description:{en:'Complete this form before borrowing keys',id:'Lengkapi formulir ini sebelum meminjam kunci'}},kembaliKunci:{title:{en:'Key Return',id:'Pengembalian Kunci'},description:{en:'Enter the key details. The system verifies the key against the outstanding borrowing and prevents returning more than the outstanding quantity',id:'Masukkan detail kunci. Sistem memverifikasi kunci berdasarkan peminjaman yang masih aktif dan mencegah pengembalian melebihi jumlah yang dipinjam'}},paket:{title:{en:'Package Registration',id:'Registrasi Paket'},description:{en:'Record the package delivery and item photo',id:'Catat pengiriman paket dan foto barang'}}};const FIELD_I18N={

});const choiceRoot=document.querySelector('#choices'),panel=document.querySelector('#panel');

const dateText=()=>{const n=new Date();return n.toLocaleDateString('en-GB')+' '+n.toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'})};
function generateUUID(){
  if(typeof crypto?.randomUUID==='function')return crypto.randomUUID();
  if(typeof crypto?.getRandomValues==='function'){
    const bytes=new Uint8Array(16);
    crypto.getRandomValues(bytes);
    bytes[6]=(bytes[6]&0x0f)|0x40;
    bytes[8]=(bytes[8]&0x3f)|0x80;
    return Array.from(bytes).map((b,i)=>[4,6,8,10].includes(i)?'-'+b.toString(16).padStart(2,'0'):b.toString(16).padStart(2,'0')).join('').replace(/^(.{8})(.{4})(.{4})(.{4})(.{12})$/,'$1-$2-$3-$4-$5');
  }
  return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g,c=>{const r=Math.random()*16|0,v=c==='x'?r:(r&0x3)|0x8;return v.toString(16)});
}
const escapeHtml=v=>String(v??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/\"/g,'&quot;').replace(/'/g,'&#039;');
function futureDateTimeValue(){const d=new Date(Date.now()+2*60*60*1000),p=n=>String(n).padStart(2,'0');return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate())+'T'+p(d.getHours())+':'+p(d.getMinutes())}
function inputMarkup([name,label,type='text',options=[]]){if(type==='textarea')return `<div class="field"><label for="${name}">${label}</label><textarea id="${name}" name="${name}" required></textarea></div>`;if(type==='select')return `<div class="field"><label for="${name}">${label}</label><select id="${name}" name="${name}" required><option value="">${L.select}</option>${options.map(x=>`<option value="${escapeHtml(x)}">${escapeHtml(DEVICE_LANG==='id'?(OPT_I18N[x]||x):x)}</option>`).join('')}</select></div>`;if(type==='datetime')return `<div class="field"><label for="${name}">${label}</label><input id="${name}" name="${name}" readonly value="${dateText()}"></div>`;if(type==='future-datetime')return `<div class="field"><label for="${name}">${label}</label><input id="${name}" name="${name}" type="datetime-local" min="${futureDateTimeValue()}" value="${futureDateTimeValue()}" required></div>`;if(type==='expected-datetime')return `<div class="field"><label for="${name}">${label}</label><input id="${name}" name="${name}" readonly value="${new Date(Date.now()+24*60*60*1000).toLocaleDateString('en-GB')+' '+new Date(Date.now()+24*60*60*1000).toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'})}"></div>`;if(type==='file')return `<div class="field"><label for="${name}">${label}</label><input id="${name}" name="${name}" type="file" accept="image/jpeg,image/png,image/webp" required></div>`;return `<div class="field"><label for="${name}">${label}</label><input id="${name}" name="${name}" type="${type}" min="1" required></div>`}
// Service cards are rendered statically in #choices for reliable V1 rendering.
function bindServiceCards(){
  if(!choiceRoot)return;
  choiceRoot.querySelectorAll('[data-form]').forEach(card=>{
    const key=card.dataset.form;
    card.addEventListener('click',e=>{
      e.preventDefault();
      e.stopPropagation();
      if(typeof showForm==='function' && forms[key]) showForm(key);
    });
    card.addEventListener('keydown',e=>{
      if((e.key==='Enter'||e.key===' ') && !e.defaultPrevented){
        e.preventDefault();
        if(typeof showForm==='function' && forms[key]) showForm(key);
      }
    });
  });
}

function formatMessage(title,data){const lines=['SECUREOPS VISITOR MANAGEMENT','',`NEW ${title.toUpperCase()}`,''];for(const [key,value] of data.entries()){if(key==='foto')continue;const field=document.querySelector(`[name="${CSS.escape(key)}"]`);lines.push(`${field?.closest('.field')?.querySelector('label')?.textContent||key}: ${value}`)}if(lastSubmission?.submissionId)lines.push('',`Submission ID: ${lastSubmission.submissionId}`);return lines.join('\n')}
async function readFile(file){if(!file)return '';return await new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result);r.onerror=rej;r.readAsDataURL(file)})}
async function submitToSupabase(form,data){const payload=Object.fromEntries(data.entries());payload.type=form.type;payload.submission_source='public-web';payload.idempotency_key=generateUUID();if(form.upload){const file=data.get('foto');payload.foto=await readFile(file)}const r=await fetch(SUPABASE_FUNCTION_URL,{method:'POST',headers:{'Content-Type':'application/json','idempotency-key':payload.idempotency_key},body:JSON.stringify(payload)});let result=null;try{result=await r.json()}catch{}if(!r.ok||!result?.ok)throw Error(result?.error||`HTTP ${r.status}`);return result}
function resetHome(){panel.classList.remove('visible');panel.innerHTML='';document.querySelectorAll('.choice').forEach(x=>x.setAttribute('aria-pressed','false'));window.scrollTo({top:0,behavior:'smooth'})}
function showSuccess(key,data,result,waWindow){const form=forms[key],id=result?.submission_id||'SECUREOPS-SUBMISSION';lastSubmission={submissionId:id};if(key==='kembaliKunci'&&result?.key_return?.discrepancy){SecureOpsUI.warning(DEVICE_LANG==='id'?'Perbedaan Jumlah Kunci':'Key Quantity Discrepancy',`Borrowed: ${result.key_return.original_borrowed_quantity}\nReturned: ${result.key_return.total_returned}\nKey Number: ${result.key_return.key_number}`)}const waNumber=String(result?.whatsapp_number||'').replace(/[^0-9]/g,'');
const waReady=/^62[0-9]{8,15}$/.test(waNumber);
if(waReady){const wa=`https://wa.me/${waNumber}?text=${encodeURIComponent(formatMessage(form.title,data))}`;if(waWindow&&!waWindow.closed){waWindow.location.href=wa}else{window.open(wa,'_blank','noopener,noreferrer')}}else{if(waWindow&&!waWindow.closed)waWindow.close();SecureOpsUI.success(DEVICE_LANG==='id'?'Pengiriman Berhasil':'Submission Successful',DEVICE_LANG==='id'?'Data berhasil disimpan.':'The submission was saved successfully.',`<div><b>Submission ID:</b> ${escapeHtml(id)}</div><div>${DEVICE_LANG==='id'?'Notifikasi WhatsApp tidak dibuka karena penerima belum dikonfigurasi.':'WhatsApp notification was not opened because no valid recipient is configured.'}</div>`) }resetHome()}
async function lookupKeyAsset(keyNumber,form,notice){
 const key=String(keyNumber||'').trim();
 const description=document.querySelector('#description');
 const qty=document.querySelector('#qty');
 if(description)description.value='';
 if(qty)qty.value='';
 if(form)form.dataset.keyAssetValid='false';
 if(!key){if(notice)notice.textContent=DEVICE_LANG==='id'?'Masukkan Nomor Kunci untuk memuat Deskripsi Kunci dan Jumlah':'Enter a Key Number to load Key Description and Quantity';return}
 if(notice){notice.textContent=DEVICE_LANG==='id'?'Memeriksa aset kunci…':'Checking Key Asset…';notice.classList.remove('error')}
 const requestId=++keyAssetLookupSeq;
 try{
  const r=await fetch(SUPABASE_FUNCTION_URL,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({type:'key_asset_lookup',key_number:key})});
  let result=null;try{result=await r.json()}catch{}
  if(requestId!==keyAssetLookupSeq)return;
  if(!r.ok||!result?.ok)throw Error(result?.error||DEVICE_LANG==='id'?'Nomor Kunci tidak dapat diverifikasi':'Key Number could not be verified');
  const asset=result.key_asset||{};
  if(description)description.value=asset.description||'';
  if(qty)qty.value=asset.quantity??'';
  if(form)form.dataset.keyAssetValid='true';
  if(notice){notice.textContent=DEVICE_LANG==='id'?'Aset kunci terverifikasi. Deskripsi dan jumlah dimuat dari Key Assets':'Key Asset verified. Description and Quantity are loaded from Key Assets';notice.classList.remove('error')}
 }catch(err){
  if(requestId!==keyAssetLookupSeq)return;
  if(form)form.dataset.keyAssetValid='false';
  if(notice){notice.textContent=err?.message||'Unable to verify Key Number';notice.classList.add('error')}
 }
}
function wireKeyBorrowingLookup(form){
 const keyInput=document.querySelector('#keyNumber');
 const description=document.querySelector('#description');
 const qty=document.querySelector('#qty');
 const notice=document.querySelector('#notice');
 if(!keyInput||!form)return;
 if(description){description.readOnly=true;description.setAttribute('aria-readonly','true')}
 if(qty){qty.readOnly=true;qty.setAttribute('aria-readonly','true')}
 form.dataset.keyAssetValid='false';
 keyInput.addEventListener('input',()=>{
  clearTimeout(keyAssetLookupTimer);
  ++keyAssetLookupSeq;
  form.dataset.keyAssetValid='false';
  if(description)description.value='';
  if(qty)qty.value='';
  if(notice){notice.textContent='';notice.classList.remove('error')}
  const value=keyInput.value.trim();
  if(!value)return;
  keyAssetLookupTimer=setTimeout(()=>lookupKeyAsset(value,form,notice),350);
 });
 keyInput.addEventListener('blur',()=>{
  clearTimeout(keyAssetLookupTimer);
  const value=keyInput.value.trim();
  if(value)lookupKeyAsset(value,form,notice);
 });
}
function showForm(key){const form=forms[key];if(form.redirect){window.location.href=form.redirect;return}document.querySelectorAll('.choice').forEach(x=>x.setAttribute('aria-pressed',String(x.dataset.form===key)));panel.innerHTML=`<div class="panel-header"><h2>${form.title}</h2><p>${form.description}</p></div><form id="activeForm" novalidate>${form.fields.map(inputMarkup).join('')}<button class="submit" type="submit">${L.submit}</button></form><div class="notice" id="notice"></div>`;panel.classList.add('visible');panel.scrollIntoView({behavior:'smooth',block:'start'});const activeForm=panel.querySelector('form');activeForm.addEventListener('submit',e=>submitForm(e,key));if(key==='pinjamKunci')wireKeyBorrowingLookup(activeForm)}
async function submitForm(e,key){e.preventDefault();const form=forms[key],el=e.currentTarget,notice=panel.querySelector('#notice');if(!el.reportValidity())return;if(key==='pinjamKunci'&&el.dataset.keyAssetValid!=='true'){notice.textContent=DEVICE_LANG==='id'?'Masukkan Nomor Kunci aktif yang valid dan tunggu Deskripsi Kunci serta Jumlah dimuat':'Please enter a valid active Key Number and wait for Key Description and Quantity to load';notice.classList.add('error');return;}const btn=el.querySelector('.submit');btn.disabled=true;notice.textContent=DEVICE_LANG==='id'?'Mengirim…':'Submitting…';notice.classList.remove('error');const data=new FormData(el);
if(key==='kembaliKunci'){
  const confirmed=window.confirm(
    (DEVICE_LANG==='id'?'KONFIRMASI PENGEMBALIAN KUNCI\n\n':'CONFIRM KEY RETURN\n\n')+
    'Key Number: '+(data.get('keyNumber')||'—')+'\n'+
    (DEVICE_LANG==='id'?'Dikembalikan Oleh: ':'Returned By: ')+(data.get('returnName')||'—')+'\n'+
    (DEVICE_LANG==='id'?'Departemen: ':'Department: ')+(data.get('department')||'—')+'\n'+
    (DEVICE_LANG==='id'?'Jumlah Dikembalikan: ':'Quantity Returning: ')+(data.get('qty')||'—')+'\n'+
    (DEVICE_LANG==='id'?'Diterima Oleh Petugas Keamanan: ':'Received By Security: ')+(data.get('security')||'—')+'\n\n'+
    (DEVICE_LANG==='id'?'Mohon periksa jumlah kunci sebelum melakukan konfirmasi':'Please verify the quantity before confirming')
  );
  if(!confirmed){btn.disabled=false;notice.textContent=DEVICE_LANG==='id'?'Pengembalian dibatalkan':'Return cancelled';return}
}
let waWindow=null;try{waWindow=window.open('about:blank','_blank');const result=await submitToSupabase(form,data);showSuccess(key,data,result,waWindow)}catch(err){if(waWindow&&!waWindow.closed)waWindow.close();const message=err?.message||'The form could not be submitted. Please try again';notice.textContent=message;notice.classList.add('error');btn.disabled=false;if(key==='keluar'&&/Visitor not found/i.test(message)){SecureOpsUI.warning(DEVICE_LANG==='id'?'Visitor Tidak Ditemukan':'Visitor Not Found',message);}else{SecureOpsUI.error(DEVICE_LANG==='id'?'Submission Gagal':'Submission Failed',message);}}}
